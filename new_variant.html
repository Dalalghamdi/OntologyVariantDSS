{% extends "base.html" %}{% block content %}<section class="card"><h2>New variant interpretation</h2><form method="post" class="grid"><label>Variant (HGVS)<input name="variant" placeholder="NM_000059.4:c.5946del" required></label><label>Gene<input name="gene" placeholder="BRCA2"></label><label>Disease<input name="disease" placeholder="Hereditary breast and ovarian cancer"></label><label>Phenotypes (comma-separated)<input name="phenotypes" placeholder="HP:0003002, HP:0100013"></label><label>gnomAD / population allele frequency<input name="allele_frequency" type="number" step="any" min="0" max="1"></label><label>ClinVar significance<input name="clinvar_significance" placeholder="Pathogenic"></label><label class="wide">Assessed ACMG/AMP criteria<input name="criteria" placeholder="PVS1, PM2, PP1"></label><label class="wide">Evidence statement<textarea name="evidence_notes" placeholder="Describe why the listed criterion/criteria are satisfied."></textarea></label><label>Evidence source<input name="evidence_source" placeholder="ClinVar SCV..., laboratory review, PMID..."></label><label>PMID<input name="pmid" placeholder="12345678"></label><div class="wide notice">The application combines criteria you enter. It does not infer that a biological observation satisfies PVS1/PS3/PM2/etc. without a validated rule.</div><button class="wide">Build graph and classify</button></form></section>{% endblock %}
