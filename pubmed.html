{% extends "base.html" %}{% block content %}<section class="card"><h2>PubMed evidence discovery</h2><form method="get"><input name="q" value="{{q}}" placeholder='"NM_000059.4:c.5946del" BRCA2' style="width:75%"><button>Search</button></form>{% if error %}<p class="error">{{error}}</p>{% endif %}{% for r in results %}<article><strong>{{r.title}}</strong><p>{{r.journal}} · {{r.date}} · PMID {{r.pmid}}</p><a target="_blank" href="https://pubmed.ncbi.nlm.nih.gov/{{r.pmid}}/">Open publication</a></article>{% endfor %}</section>{% endblock %}
